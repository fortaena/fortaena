# Fortæana Neo4j Knowledge Graph Service
# Run with: docker compose up -d
# Access: http://localhost:7474 (user: neo4j / password: fortaena2026)

version: "3.8"

services:
  neo4j:
    image: neo4j:5
    container_name: fortaena-neo4j
    restart: unless-stopped
    ports:
      - "7474:7474"   # HTTP browser
      - "7687:7687"   # Bolt protocol
    environment:
      - NEO4J_AUTH=neo4j/fortaena2026
      - NEO4J_SERVER_PLUGINS=apoc
      - NEO4J_dbms_memory_heap_initialsize=512m
      - NEO4J_dbms_memory_heap_maxsize=1g
      - NEO4J_dbms_memory_pagecache_size=512m
      - NEO4J_dbms_transaction_log_preallocation=false
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - neo4j_import:/import
      - neo4j_backup:/backup
    networks:
      - fortaena_network

volumes:
  neo4j_data:
  neo4j_logs:
  neo4j_import:
  neo4j_backup:

networks:
  fortaena_network:
    driver: bridge