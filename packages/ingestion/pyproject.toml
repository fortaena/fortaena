[project]
name = "fortaena-ingestion"
version = "0.1.0"
description = "Ingestion pipeline for Fortæana UAP/OVNI archive"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
